<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Crucible: put published results to the test">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2740"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ff6b35" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6b86"/>
      <stop offset="0.5" stop-color="#a8b6cc"/>
      <stop offset="1" stop-color="#5b6b86"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- crucible: a vessel where metal is heated to prove what it is -->
  <circle cx="190" cy="132" r="118" fill="url(#glow)"/>
  <path d="M96 118 H284 L258 222 Q190 252 122 222 Z" fill="url(#metal)"/>
  <rect x="88" y="108" width="204" height="18" rx="9" fill="#cbd5e6"/>
  <ellipse cx="190" cy="127" rx="88" ry="10" fill="#ff8a3d"/>
  <circle cx="160" cy="96" r="9" fill="#ffb347"/>
  <circle cx="198" cy="80" r="6" fill="#ffd27a"/>
  <circle cx="224" cy="98" r="8" fill="#ff8a3d"/>
  <path d="M130 262 Q190 286 250 262" stroke="#ff6b35" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>

  <text x="350" y="150" fill="#ffffff" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="84" font-weight="700" letter-spacing="-1">Crucible</text>
  <text x="352" y="204" fill="#ffb347" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="32" font-weight="600">Put published results to the test.</text>
  <text x="352" y="248" fill="#aab6cc" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21">An open-source agent that re-runs research code in a sandbox</text>
  <text x="352" y="278" fill="#aab6cc" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21">and publishes rerunnable proof of what holds up.</text>
</svg>
